name: Update GitHub Profile Stats SVGs

on:
  schedule:
    - cron: '0 0 * * *' # Automatically updates stats every midnight
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Latest Stats & Languages SVGs
        run: |
          mkdir -p profile
          curl -s "https://github-stats-extended.vercel.app/api?username=jeganbaskar19&show_icons=true&theme=tokyonight&hide_border=true" -o profile/stats.svg
          curl -s "https://github-stats-extended.vercel.app/api/top-langs/?username=jeganbaskar19&layout=compact&theme=tokyonight&hide_border=true" -o profile/top-langs.svg

      - name: Generate Streak Stats Card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=jeganbaskar19&theme=tokyonight&hide_border=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push Updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: auto-update profile stats SVGs [skip ci]" || echo "No changes to commit"
          git push
